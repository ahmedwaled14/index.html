<!DOCTYPE html> 
<html lang="en">
<head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharma Batch & Container Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Camera QR Scanner -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- jsPDF & AutoTable for PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans p-4 min-h-screen">

    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md p-6 space-y-4">
        <h1 class="text-xl font-bold text-slate-900 border-b pb-2">Corridor Container Tracker</h1>

        <!-- Camera Scanner Area -->
        <div class="bg-slate-50 p-3 rounded-lg border border-slate-200">
            <div id="reader" class="w-full rounded-lg overflow-hidden"></div>
            <p id="scan-status" class="text-xs text-slate-500 text-center mt-1 hidden"></p>
            <button id="start-scan-btn" onclick="startScanner()" class="w-full mt-2 bg-blue-600 text-white font-medium py-2 rounded-md hover:bg-blue-700 transition">
                📷 Open Camera / Scan Container QR
            </button>
            <button id="stop-scan-btn" onclick="stopScanner()" class="w-full mt-2 bg-rose-600 text-white font-medium py-2 rounded-md hidden">
                Stop Camera
            </button>
        </div>

        <!-- Inputs Form -->
        <div class="space-y-3">
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">1. Select Zone</label>
                <select id="zoneSelect" class="w-full p-2.5 bg-white border border-slate-300 rounded-md focus:outline-blue-500 font-medium text-slate-700">
                    <option value="" disabled selected>-- Choose Zone (A to F) --</option>
                    <option value="Zone A">Zone A</option>
                    <option value="Zone B">Zone B</option>
                    <option value="Zone C">Zone C</option>
                    <option value="Zone D">Zone D</option>
                    <option value="Zone E">Zone E</option>
                    <option value="Zone F">Zone F</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">2. Batch Number</label>
                <input type="text" id="batchInput" placeholder="Scan or enter Batch Number" class="w-full p-2 border border-slate-300 rounded-md focus:outline-blue-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">3. Container Number</label>
                <input type="text" id="containerInput" placeholder="e.g. Container 3 of 7 or 3/7" class="w-full p-2 border border-slate-300 rounded-md focus:outline-blue-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">4. Personnel Name / ID</label>
                <input type="text" id="operatorInput" placeholder="Personnel ID or Name" class="w-full p-2 border border-slate-300 rounded-md focus:outline-blue-500">
            </div>

            <button onclick="logMovement()" class="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-md hover:bg-emerald-700 transition shadow">
                Confirm & Log Container
            </button>
        </div>

        <!-- Search by Batch -->
        <div class="pt-4 border-t border-slate-200">
            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Search Batch → Last Known Zone</label>
            <input type="text" id="searchBatchInput" oninput="searchBatch()" placeholder="Type or scan a Batch Number..." class="w-full p-2 border border-slate-300 rounded-md focus:outline-blue-500">
            <div id="searchResult" class="mt-2 hidden"></div>
        </div>

        <!-- Recent Logs Table -->
        <div class="pt-4 border-t border-slate-200">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-md font-semibold text-slate-700">Recent Movements</h2>
                <div class="space-x-1">
                    <button onclick="exportPDF()" class="text-xs bg-red-600 hover:bg-red-700 text-white font-medium px-2.5 py-1 rounded shadow transition">📄 Export PDF</button>
                    <button onclick="exportCSV()" class="text-xs bg-slate-200 hover:bg-slate-300 px-2 py-1 rounded text-slate-700">CSV</button>
                </div>
            </div>
            <div class="max-h-52 overflow-y-auto border border-slate-200 rounded">
                <table class="w-full text-xs text-left text-slate-600">
                    <thead class="bg-slate-100 text-slate-700 sticky top-0">
                        <tr>
                            <th class="p-2">Batch</th>
                            <th class="p-2">Container</th>
                            <th class="p-2">Zone</th>
                            <th class="p-2">Time</th>
                        </tr>
                    </thead>
                    <tbody id="logTableBody">
                        <!-- Log entries load here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let html5QrCode;
        let logs = JSON.parse(localStorageSafeGet('containerLogs') || '[]');

        // ---------- Safe localStorage helpers (works even if storage is blocked) ----------
        function localStorageSafeGet(key) {
            try { return localStorage.getItem(key); } catch (e) { return null; }
        }
        function localStorageSafeSet(key, value) {
            try { localStorage.setItem(key, value); } catch (e) { /* ignore */ }
        }

        // ---------- Camera Scanner ----------
        function startScanner() {
            document.getElementById('start-scan-btn').classList.add('hidden');
            document.getElementById('stop-scan-btn').classList.remove('hidden');
            const statusEl = document.getElementById('scan-status');
            statusEl.classList.remove('hidden');
            statusEl.textContent = 'Starting camera...';

            html5QrCode = new Html5Qrcode("reader");

            const config = {
                fps: 10,
                qrbox: { width: 250, height: 250 }
            };

            html5QrCode.start(
                { facingMode: "environment" }, // use rear camera on phones
                config,
                onScanSuccess,
                onScanFailure
            ).then(() => {
                statusEl.textContent = 'Point the camera at the QR code';
            }).catch((err) => {
                let msg = 'Camera error.';
                if (String(err).includes('NotAllowedError')) {
                    msg = 'Camera permission was blocked. Please allow camera access for this site in your browser settings, then try again.';
                } else if (String(err).includes('NotFoundError')) {
                    msg = 'No camera was found on this device.';
                } else {
                    msg = 'Camera error: ' + err;
                }
                statusEl.textContent = msg;
                document.getElementById('start-scan-btn').classList.remove('hidden');
                document.getElementById('stop-scan-btn').classList.add('hidden');
            });
        }

        function stopScanner() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                    document.getElementById('start-scan-btn').classList.remove('hidden');
                    document.getElementById('stop-scan-btn').classList.add('hidden');
                    document.getElementById('scan-status').classList.add('hidden');
                }).catch(() => {
                    document.getElementById('start-scan-btn').classList.remove('hidden');
                    document.getElementById('stop-scan-btn').classList.add('hidden');
                });
            }
        }

        function onScanFailure(error) {
            // Called continuously while no QR is found — ignore, this is normal.
        }

        function onScanSuccess(decodedText, decodedResult) {
            // Vibrate + beep-like feedback if supported
            if (navigator.vibrate) navigator.vibrate(150);

            fillFieldsFromQR(decodedText);

            // Stop the camera automatically after a successful scan
            stopScanner();

            const statusEl = document.getElementById('scan-status');
            statusEl.classList.remove('hidden');
            statusEl.textContent = 'QR captured ✔';
        }

        // The QR code holds the Batch Number as plain text.
        // Whatever is scanned goes straight into the Batch Number field.
        function fillFieldsFromQR(text) {
            const batch = text.trim();
            document.getElementById('batchInput').value = batch;
            // Move focus to Container Number so the operator can continue quickly
            document.getElementById('containerInput').focus();
        }

        // ---------- Logging ----------
        function logMovement() {
            const zone = document.getElementById('zoneSelect').value;
            const batch = document.getElementById('batchInput').value.trim();
            const container = document.getElementById('containerInput').value.trim();
            const operator = document.getElementById('operatorInput').value.trim();

            if (!zone || !batch || !container || !operator) {
                alert('Please fill in all fields before logging.');
                return;
            }

            const entry = {
                batch, container, zone, operator,
                time: new Date().toLocaleString()
            };
            logs.unshift(entry);
            localStorageSafeSet('containerLogs', JSON.stringify(logs));
            renderLogs();
            searchBatch(); // refresh search result if a search is active

            // Reset fields for next scan, keep operator name for convenience
            document.getElementById('batchInput').value = '';
            document.getElementById('containerInput').value = '';
            document.getElementById('zoneSelect').selectedIndex = 0;
        }

        function renderLogs() {
            const tbody = document.getElementById('logTableBody');
            tbody.innerHTML = '';
            logs.forEach(log => {
                const row = document.createElement('tr');
                row.className = 'border-t border-slate-100';
                row.innerHTML = `
                    <td class="p-2">${escapeHtml(log.batch)}</td>
                    <td class="p-2">${escapeHtml(log.container)}</td>
                    <td class="p-2">${escapeHtml(log.zone)}</td>
                    <td class="p-2">${escapeHtml(log.time)}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ---------- Search by Batch ----------
        // logs is stored newest-first (we use unshift when logging),
        // so the first match found for a batch is automatically its latest entry.
        function searchBatch() {
            const query = document.getElementById('searchBatchInput').value.trim().toLowerCase();
            const resultBox = document.getElementById('searchResult');

            if (!query) {
                resultBox.classList.add('hidden');
                resultBox.innerHTML = '';
                return;
            }

            const matches = logs.filter(l => l.batch.toLowerCase() === query);

            if (matches.length === 0) {
                resultBox.classList.remove('hidden');
                resultBox.innerHTML = `
                    <div class="bg-amber-50 border border-amber-200 text-amber-700 text-xs p-2.5 rounded-md">
                        No record found for batch "${escapeHtml(query)}".
                    </div>`;
                return;
            }

            const latest = matches[0]; // newest first
            resultBox.classList.remove('hidden');
            resultBox.innerHTML = `
                <div class="bg-emerald-50 border border-emerald-200 p-2.5 rounded-md">
                    <p class="text-xs text-emerald-700">
                        Batch <span class="font-bold">${escapeHtml(latest.batch)}</span> was last seen in
                        <span class="font-bold">${escapeHtml(latest.zone)}</span>
                    </p>
                    <p class="text-[11px] text-emerald-600 mt-0.5">
                        Container: ${escapeHtml(latest.container)} • ${escapeHtml(latest.time)} • Logged by ${escapeHtml(latest.operator)}
                    </p>
                    ${matches.length > 1 ? `<p class="text-[11px] text-emerald-500 mt-1">${matches.length} total movements found for this batch</p>` : ''}
                </div>`;
        }

        // ---------- Export ----------
        function exportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text('Corridor Container Tracker - Movement Log', 14, 15);
            doc.autoTable({
                startY: 20,
                head: [['Batch', 'Container', 'Zone', 'Operator', 'Time']],
                body: logs.map(l => [l.batch, l.container, l.zone, l.operator, l.time])
            });
            doc.save('container_log.pdf');
        }

        function exportCSV() {
            let csv = 'Batch,Container,Zone,Operator,Time\n';
            logs.forEach(l => {
                csv += `${l.batch},${l.container},${l.zone},${l.operator},${l.time}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'container_log.csv';
            a.click();
            URL.revokeObjectURL(url);
        }

        // Initial render on page load
        renderLogs();
    </script>
</body>
</html>
